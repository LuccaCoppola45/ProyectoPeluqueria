spring.application.name=ProyectoPeluqueria

spring.datasource.url=jdbc:mysql://localhost:3306/peluqueria?createDatabaseIfNotExist=true&serverTimezone=America/Argentina/Buenos_Aires
spring.datasource.username=root
spring.datasource.password=lucca2005

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# WhatsApp Cloud API. Leave disabled until Meta test credentials are configured.
whatsapp.enabled=${WHATSAPP_ENABLED:false}
whatsapp.graph-url=${WHATSAPP_GRAPH_URL:https://graph.facebook.com/v23.0}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:}
whatsapp.reminder-template=${WHATSAPP_REMINDER_TEMPLATE:recordatorio_turno}
whatsapp.template-language-code=${WHATSAPP_TEMPLATE_LANGUAGE_CODE:es_AR}
whatsapp.scheduler-delay-ms=${WHATSAPP_SCHEDULER_DELAY_MS:300000}